<!doctype html>
<html lang="en" class="no-js">
    <head>
        <!-- Title and Icon -->

        <title id="landingTitle">YFM-Webinar</title>
        <link id="shortcutIcon" rel="icon" type="image/png" href="../images/yfm-favicon.png?v=2" />
        <link rel="shortcut icon" href="../images/yfm-favicon.png?v=2" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/yfm-favicon.png?v=2" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="darkreader-lock" />

        <meta
            name="description"
            content="YFM-Webinar P2P is an open-source self-hosted WebRTC video calling and meeting platform. Create fast peer-to-peer video calls with screen sharing, chat, whiteboard and collaboration directly in the browser."
        />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <!-- https://developer.x.com/en/docs/x-for-websites/cards/overview/markup -->

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{OG_TITLE}}" />
        <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
        <meta name="twitter:image" content="{{OG_IMAGE}}" />

        <!-- xss -->

        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- https://cdnjs.com/libraries/font-awesome -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

        <!-- StyleSheet -->

        <link rel="stylesheet" href="../css/_tokens.css" />
        <link rel="stylesheet" href="../css/landing.css?v=4" />
        <link rel="stylesheet" href="../css/newcall.css?v=3" />
        <style>
            #joinRoomButton {
                background: #7c35ca !important;
                border-color: rgba(255, 255, 255, 0.15) !important;
                box-shadow: 0 4px 18px rgba(124, 53, 202, 0.4) !important;
            }
            #joinRoomButton:hover {
                background: #8e42e4 !important;
                box-shadow: 0 6px 24px rgba(124, 53, 202, 0.55) !important;
            }
        </style>

        <!-- https://animate.style 4 using for swal fadeIn-Out -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

        <!-- Snow effects -->

        <link rel="stylesheet" href="../css/snow.css" />
        <script defer src="../js/snow.js"></script>

        <!-- JavaScripts -->

        <script async src="../js/stats.js"></script>

        <!-- sweetalert -->

        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>

        <!-- yfm P2P Widget -->

        <script defer src="../js/widget.js"></script>
    </head>
    <body class="has-animations">
        <div id="snow-container"></div>
        <div class="body-wrap">
            <header class="site-header reveal-from-top">
                <div class="container">
                    <div class="site-header-inner" style="justify-content: center; display: flex; align-items: center">
                        <div
                            class="brand"
                            style="
                                margin: 0;
                                border-radius: 0;
                                display: flex;
                                justify-content: center;
                                align-items: center;
                            "
                        >
                            <a href="/" style="display: inline-flex; align-items: center">
                                <img
                                    src="../images/yfm-logo.png"
                                    alt="YourFuture Mantra"
                                    style="
                                        height: 48px;
                                        width: auto;
                                        max-width: 250px;
                                        object-fit: contain;
                                        border-radius: 0;
                                        filter: none;
                                    "
                                />
                            </a>
                        </div>
                    </div>
                </div>
            </header>
            <main class="site-content">
                <section
                    class="cta section center-content-mobile reveal-from-bottom mb-32"
                    style="padding-top: clamp(210px, 26vh, 280px)"
                >
                    <div class="container">
                        <div class="cta-inner section-inner cta-split br-12">
                            <div class="cta-slogan">
                                <h3 id="appJoinDescription" class="m-0">
                                    Pick a room name.<br />
                                    How about this one?
                                </h3>
                            </div>
                            <div class="cta-action">
                                <div class="mb-0">
                                    <label class="form-label screen-reader" for="roomName">YFM-Webinar</label>
                                    <div class="form-group-desktop">
                                        <div class="room-input-wrap">
                                            <input
                                                id="roomName"
                                                class="form-input"
                                                type="text"
                                                value="yfm-webinar"
                                                maxlength="64"
                                            />
                                            <button
                                                id="genRoomButton"
                                                class="room-gen-btn fas fa-arrows-rotate"
                                            ></button>
                                        </div>
                                        <button id="joinRoomButton" class="button button-primary br-6">
                                            Join Room
                                        </button>
                                    </div>
                                    <div class="mt-16">
                                        <button
                                            id="customizeRoomButton"
                                            class="button button-custom-room button-block br-6"
                                        >
                                            Customize Room
                                        </button>
                                    </div>
                                </div>
                                <div id="lastRoomContainer" class="last-room">
                                    <span id="appJoinLastRoom">Your recent room:</span>
                                    <a id="lastRoom"></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <footer id="footer" class="site-footer center-content">
                <div class="container">
                    <div class="site-footer-inner" style="padding: 10px 0 20px 0 !important; text-align: center">
                        <div class="footer-copyright" style="color: #64748b; font-size: 13px; font-weight: 500">
                            &copy; 2026
                            <a
                                href="https://webmediaindia.com/home.html"
                                target="_blank"
                                rel="noopener noreferrer"
                                style="color: #0f172a; font-weight: 600; text-decoration: none"
                                >WEBMEDIA</a
                            >. All rights reserved.
                        </div>
                    </div>
                </div>
            </footer>
        </div>
        <script defer src="../js/utils.js"></script>
        <script defer src="../js/common.js"></script>
        <script defer src="../js/brand.js"></script>
        <script defer src="../js/landing.js"></script>
    </body>
</html>
